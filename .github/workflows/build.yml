name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Flutter bootstrap (Java + Gradle + codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          setup-java: 'true'
          cache-gradle: 'true'
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Decode keystore (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > learning_tracker/android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not set."
          fi

      - name: Create key.properties (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -f learning_tracker/android/app/keystore.jks ]; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
              > learning_tracker/android/key.properties
          fi

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: learning_tracker
        run: flutter build apk --release

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: learning_tracker
        run: flutter build apk --debug

      - name: Cleanup signing and Firebase files
        if: always()
        run: |
          rm -f learning_tracker/android/key.properties
          rm -f learning_tracker/android/app/keystore.jks
          rm -f learning_tracker/android/app/google-services.json
          rm -f learning_tracker/lib/firebase_options.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: learning-tracker-${{ github.event.inputs.build_type }}-apk
          path: learning_tracker/build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
          retention-days: 30
