name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Decode keystore (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > learning_tracker/android/app/keystore.jks
          else
            echo "⚠️  KEYSTORE_BASE64 secret not set. Unsigned APK will be built."
          fi

      - name: Create key.properties (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -f learning_tracker/android/app/keystore.jks ]; then
            cat > learning_tracker/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/keystore.jks
          EOF
            # Strip leading whitespace from each line
            sed -i 's/^[[:space:]]*//' learning_tracker/android/key.properties
          fi

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: learning_tracker
        run: flutter build apk --release

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: learning_tracker
        run: flutter build apk --debug

      - name: Cleanup signing and Firebase files (runs even on failure)
        if: always()
        run: |
          rm -f learning_tracker/android/key.properties
          rm -f learning_tracker/android/app/keystore.jks
          rm -f learning_tracker/android/app/google-services.json
          rm -f learning_tracker/lib/firebase_options.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-tracker-${{ github.event.inputs.build_type }}-apk
          path: learning_tracker/build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
          retention-days: 30
