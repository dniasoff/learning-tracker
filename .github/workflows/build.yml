name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Local composite actions (`uses: ./...`) resolve from the runner's
      # workspace, which starts empty — the repo must be checked out before
      # the composite's action.yml can be found (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (Java + Gradle + codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          setup-java: 'true'
          cache-gradle: 'true'
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # AUD-platform-03: aborts (exit 1) instead of only warning when
      # KEYSTORE_BASE64 is empty, so a misconfigured secret can no longer
      # let this job fall through into `flutter build apk --release`
      # without key.properties — which Gradle would otherwise silently
      # sign with the debug keystore and upload as a "release" artifact.
      # See tool/decode_release_keystore.sh + its test for the behavior
      # this step delegates to.
      - name: Decode keystore (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: tool/decode_release_keystore.sh learning_tracker/android/app/keystore.jks

      - name: Create key.properties (Release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -f learning_tracker/android/app/keystore.jks ]; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
              > learning_tracker/android/key.properties
          fi

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: learning_tracker
        env:
          # AUD-platform-03: belt-and-suspenders — makes Gradle's release
          # signingConfig itself refuse the debug-signing fallback if this
          # step is ever reached without a real key.properties in place
          # (see android/app/build.gradle.kts).
          REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build apk --release

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: learning_tracker
        run: flutter build apk --debug

      - name: Cleanup signing and Firebase files
        if: always()
        run: |
          rm -f learning_tracker/android/key.properties
          rm -f learning_tracker/android/app/keystore.jks
          rm -f learning_tracker/android/app/google-services.json
          rm -f learning_tracker/lib/firebase_options.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: learning-tracker-${{ github.event.inputs.build_type }}-apk
          path: learning_tracker/build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
          retention-days: 30
