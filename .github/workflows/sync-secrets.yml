name: Sync Secrets to Local

on:
  workflow_dispatch:

jobs:
  encrypt-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Encrypt FIREBASE_OPTIONS_DART
        env:
          SECRET: ${{ secrets.FIREBASE_OPTIONS_DART }}
          KEY: ${{ secrets.LOCAL_SYNC_KEY }}
        run: |
          mkdir -p artifacts
          echo "$SECRET" | openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$KEY" | base64 > artifacts/firebase_options.enc

      - name: Encrypt GOOGLE_SERVICES_JSON_BASE64
        env:
          SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEY: ${{ secrets.LOCAL_SYNC_KEY }}
        run: |
          echo "$SECRET" | openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$KEY" | base64 > artifacts/google_services.enc

      - name: Upload encrypted artifacts
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-secrets
          path: artifacts/
          retention-days: 1
