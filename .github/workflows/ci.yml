name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, dev/**]

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Verify formatting
        working-directory: learning_tracker
        run: dart format --set-exit-if-changed .

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Analyze code
        working-directory: learning_tracker
        run: dart analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Run unit and widget tests
        working-directory: learning_tracker
        run: flutter test --concurrency=4 --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: learning_tracker/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
