name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, dev/**]

# Shared checkout/Flutter/pub bootstrap is factored into the composite action
# at .github/actions/flutter-bootstrap (GitHub Actions has no native YAML
# anchors, so a composite action — not per-job copy/paste — is the GHA-native
# reuse mechanism; AUD-guardrails-25). Each job still runs independently in
# parallel; only the bootstrap steps are shared, not the runners themselves.

jobs:
  # ── 1. format-check ────────────────────────────────────────────────────────
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Local composite actions (`uses: ./...`) resolve from the runner's
      # workspace, which starts empty — the repo must be checked out before
      # the composite's action.yml can be found (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap
        uses: ./.github/actions/flutter-bootstrap

      - name: Verify formatting
        working-directory: learning_tracker
        run: dart format --set-exit-if-changed .

  # ── 2. analyze ─────────────────────────────────────────────────────────────
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # See the format-check job above: local composite actions require the
      # repo to already be checked out (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (codegen + l10n + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          run-codegen: 'true'
          run-l10n: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # ── AG-7 freshness gate (docs/coding-standards.md) ──
      # Committed generated output (*.g.dart, *.freezed.dart, *.gr.dart, and
      # lib/l10n/app_localizations*.dart) must match what build_runner/gen-l10n
      # produce on a clean tree. google-services.json, firebase_options.dart,
      # and content.db.gz (written by the bootstrap's secret-decode/asset-prep
      # steps above) are all gitignored (learning_tracker/.gitignore) and
      # therefore untracked — plain `git diff` never reports them, so folding
      # those steps into the same bootstrap call as codegen/l10n (AUD-guardrails-25)
      # cannot be mistaken for codegen drift regardless of step order.
      - name: Verify generated code is fresh (AG-7)
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale — committed *.g.dart/*.freezed.dart/l10n output does not match what 'dart run build_runner build --delete-conflicting-outputs' and 'flutter gen-l10n' produce. Regenerate in learning_tracker/ and commit the result. See docs/coding-standards.md AG-7."
            exit 1
          fi

      - name: Analyze code
        working-directory: learning_tracker
        run: dart analyze --fatal-infos

  # ── 3. audit ───────────────────────────────────────────────────────────────
  # Runs `make audit` when the target exists; skips gracefully if not yet landed.
  # `make audit` (learning_tracker/Makefile, the authoritative audit target)
  # depends on `lint-rules-test`, which runs `dart test` inside
  # packages/custom_lints/ — the unit-test suite for the 9 custom lint rules
  # themselves (AUD-guardrails-17). That suite is a hard gate: a regression in
  # any rule's matching/whitelist logic fails `make audit`, hence this job.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # See the format-check job above: local composite actions require the
      # repo to already be checked out (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap
        uses: ./.github/actions/flutter-bootstrap
        with:
          cache-custom-lints: 'true'
          run-codegen: 'true'
          run-l10n: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Run audit (skip gracefully if target absent)
        working-directory: learning_tracker
        run: |
          if make -n audit >/dev/null 2>&1; then
            make audit
          else
            echo "::notice::Makefile 'audit' target not found — skipping (DNI-389 not yet merged)"
          fi

  # ── 4. lint ────────────────────────────────────────────────────────────────
  # Runs custom_lint. AUD-guardrails-03 (2026-07-03): pub.dev's latest
  # custom_lint/custom_lint_core (0.8.1) only support analyzer ^8, but the app
  # forces analyzer ^9 (needed by json_serializable/riverpod_generator) — this
  # used to crash the tool outright. learning_tracker/pubspec.yaml and
  # packages/custom_lints/pubspec.yaml now pin an unreleased-but-merged
  # analyzer-9-compatible commit via dependency_overrides (see the comments
  # there), which does fix that compile crash. It does NOT make this step
  # meaningful, though: making `dart run custom_lint` discover the project
  # requires `analyzer: plugins: [custom_lint]` in analysis_options.yaml, and
  # enabling that marker breaks the `analyze` job's hard gate instead
  # (analysis_server's legacy plugin loader re-resolves custom_lint from
  # pub.dev, ignoring dependency_overrides, and 0.8.2 isn't published there —
  # see the comment above the `analyzer:` block in
  # learning_tracker/analysis_options.yaml, and docs/coding-standards.md
  # "custom_lint toolchain status", for the full story). With the marker
  # necessarily omitted, this step currently exits 0 with "No issues found!"
  # regardless of real violations (0 projects discovered, not 0 violations) —
  # it is a no-op, not a meaningful check. Left in place (warn-only) so it
  # starts reporting real diagnostics again the moment the toolchain conflict
  # is resolved (analyzer-9-compatible pub.dev release, or migrating off
  # custom_lint); do not treat a green run here as a signal either way.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # See the format-check job above: local composite actions require the
      # repo to already be checked out (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap
        uses: ./.github/actions/flutter-bootstrap

      - name: Run custom_lint (currently a no-op — see AUD-guardrails-03 comment above)
        working-directory: learning_tracker
        run: |
          if dart pub deps --json 2>/dev/null | grep -q '"custom_lint"'; then
            dart run custom_lint || echo "::warning::custom_lint reported violations — see docs/coding-standards.md 'custom_lint toolchain status'. Note: a clean/silent run here does NOT mean the codebase is clean; the CLI currently cannot discover the project (AUD-guardrails-03) so it normally exits 0 without scanning anything."
          else
            echo "::notice::custom_lint not in pubspec — skipping"
          fi

  # ── 5. test + 6. coverage-floor ────────────────────────────────────────────
  # `make ci` (learning_tracker/Makefile) also depends on `lint-rules-test`
  # (packages/custom_lints/ unit tests — AUD-guardrails-17), so this job
  # doubles up the same coverage as the `audit` job above.
  test:
    name: test
    runs-on: ubuntu-latest
    # 2026-07-21: this job originally ran the FULL `make ci` (analyze +
    # lint-rules-test + the whole flutter test suite with --coverage +
    # test-serial-tools + test-rules + test-functions) on a standard
    # (much slower than a typical local dev box) GitHub-hosted runner, and was
    # repeatedly cancelled at its timeout — first 30min, then 60min even after
    # trimming the 4 targets already covered by other dedicated jobs
    # (analyze/lint-rules-test/test-rules/test-functions). A live run's log
    # showed the actual bottleneck: `test-serial-tools` (audit_and_arb_parity_
    # test.dart, which shells out to a real `make audit` per sub-test, ~90s+
    # each, ~15 of them, --concurrency=1 by design) running SEQUENTIALLY after
    # the ~10k-test main suite in the same job/timeout budget. Split into its
    # own parallel job below (`test-serial-tools`) — GitHub Actions runs jobs
    # concurrently by default, so this REDUCES wall-clock instead of costing
    # more, since the two no longer share one timeout.
    timeout-minutes: 45

    steps:
      # See the format-check job above: local composite actions require the
      # repo to already be checked out (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          cache-custom-lints: 'true'
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # Installed before `make ci` (not just before the floor check below) so
      # the `test` Makefile target's own lcov.info generated-file exclusion
      # (AUD-t-cross-16) actually runs in CI, not just locally when a dev
      # happens to have lcov installed.
      - name: Install lcov
        run: sudo apt-get install -y lcov

      # `test-serial-tools` now runs as its own parallel job below (see
      # comment on this job's `timeout-minutes`) — this step covers only
      # `validate-calendar` + `test`, the 2 targets unique to this job.
      # lcov.info (needed by the coverage-floor/Codecov steps below) is
      # produced by `test`.
      - name: Run tests with coverage
        working-directory: learning_tracker
        run: make validate-calendar test

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: |
            learning_tracker/test/**/failures/
            learning_tracker/test/**/*_masterImage.png
            learning_tracker/test/**/*_testImage.png
            learning_tracker/test/**/*_isolatedDiff.png
          if-no-files-found: ignore
          retention-days: 7

      # ── 6. coverage-floor (60% line coverage, always enforced) ──
      # lcov is installed earlier (before `make ci`) so the `test` Makefile
      # target can exclude generated files from coverage/lcov.info itself;
      # this step reads that already-filtered file.
      - name: Assert coverage floor ≥ 60%
        run: |
          LCOV_FILE="learning_tracker/coverage/lcov.info"
          SUMMARY=$(lcov --summary "$LCOV_FILE" 2>&1)
          echo "$SUMMARY"
          # Extract line coverage percentage (format: "lines......: 72.5% (...)").
          PCT=$(echo "$SUMMARY" | grep -i "^  lines" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$PCT" ]; then
            echo "::error::Could not parse line coverage from lcov --summary output"
            exit 1
          fi
          FLOOR=60
          # Use awk for float comparison (bash can't do floats natively)
          PASS=$(awk -v pct="$PCT" -v floor="$FLOOR" 'BEGIN { print (pct >= floor) ? "yes" : "no" }')
          echo "Line coverage: ${PCT}% (floor: ${FLOOR}%)"
          if [ "$PASS" != "yes" ]; then
            echo "::error::Coverage ${PCT}% is below the ${FLOOR}% floor — add tests or lower the floor deliberately"
            exit 1
          fi
          echo "Coverage check passed: ${PCT}% >= ${FLOOR}%"

      # ── R6d (docs/test-artifacts/reassurance-plan.md Surface 6) ──
      # The 60% floor above is a fraction of the lines lcov actually SAW —
      # a lib/**.dart file that's never imported by any test-reachable code
      # path has NO `SF:` entry in lcov.info at all, so it vanishes from
      # both the numerator and the denominator instead of dragging the
      # percentage down. --strict hard-fails if coverage/lcov.info is
      # missing (unlike `make audit`'s own soft-skipping copy of this same
      # check, appropriate for a dev who hasn't run `make test` locally) —
      # here, its absence would mean the gate silently never ran.
      - name: Assert every lib/ file appears in the coverage denominator (R6d)
        working-directory: learning_tracker
        run: dart run tool/check_lcov_denominator.dart --strict

      - name: Upload golden test failures (diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-test-failures
          path: learning_tracker/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: hashFiles('learning_tracker/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          files: learning_tracker/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 6b. test-serial-tools ────────────────────────────────────────────────
  # Split out of the `test` job (2026-07-21) — see the comment on that job's
  # `timeout-minutes`. audit_and_arb_parity_test.dart shells out to a real
  # `make audit` per sub-test (~90s+ each, ~15 of them), tagged serial-tools
  # and run with --concurrency=1 by design (contends with the parallel suite
  # otherwise). Runs concurrently with `test` as its own GitHub Actions job
  # rather than sequentially inside it, so the split reduces wall-clock
  # instead of adding to it.
  test-serial-tools:
    name: test-serial-tools
    runs-on: ubuntu-latest
    # 2026-07-21: even isolated in its own job, this was still cancelled at
    # 45min. A live run's log showed steady (not hung) progress: ~10 of the
    # file's 21 sub-tests completed in ~43min (~4.3min/test - each shells out
    # to a real `make audit` or `dart run tool/...`, a cold process start
    # every time, --concurrency=1 by design). 21 tests x ~4.3min extrapolates
    # to ~90min. Sized to that evidence rather than guessed.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          cache-custom-lints: 'true'
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Run serial-tagged tool tests
        working-directory: learning_tracker
        run: make test-serial-tools

  # ── 7. firestore-rules ──────────────────────────────────────────────────────
  firestore-rules:
    name: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Runs the CANONICAL rules suite — learning_tracker/functions/test/firestore_rules.test.mjs
      # — against the LIVE rules at learning_tracker/firestore.rules. The old
      # test/firestore-rules/*.js suite was obsolete (accounts/{uid} model) AND read a
      # non-existent repo-root firestore.rules, so this job errored ENOENT on every run —
      # silently un-gating rules drift. See `make test-rules`.
      #
      # TQ-9: this job HARD-FAILS if the suite file is missing — it must never
      # soft-skip. A missing suite means the rules layer has zero test coverage,
      # which is a CI-stopping condition, not a "notice" to skip past.
      - name: Fail if firestore-rules suite is missing (TQ-9 — no soft-skip)
        run: |
          if [ ! -f "learning_tracker/functions/test/firestore_rules.test.mjs" ]; then
            echo "::error::functions/test/firestore_rules.test.mjs not found — the rules suite must never be soft-skipped (TQ-9)."
            exit 1
          fi

      - name: Setup Java (required by Firebase emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learning_tracker/functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache Firebase emulator
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-firestore-v1.21.0

      - name: Install test dependencies
        working-directory: learning_tracker/functions
        run: npm ci

      # TQ-9: chained in the SAME emulators:exec session as the test run so the
      # coverage endpoint reflects this run's evaluations before the emulator
      # (and its in-memory coverage report) shuts down. Fails the job on any
      # never-evaluated `allow ...: if <condition>` rule expression — see
      # functions/tool/check_rule_coverage.mjs for the coverage semantics.
      - name: Run Firestore rules tests + TQ-9 rule-coverage gate against emulator
        working-directory: learning_tracker
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-rules \
            "node --test functions/test/firestore_rules.test.mjs && node functions/tool/check_rule_coverage.mjs demo-rules firestore.rules"

  # ── 8. functions ───────────────────────────────────────────────────────────
  # Builds functions/src (tsc) and runs the Cloud Functions handler suite
  # (learning_tracker/functions/test/cf_*.test.mjs, 3,236 lines / ~274 tests)
  # against the Firestore + Auth emulators. functions/src/index.ts is the
  # highest-privilege, rules-bypassing code in the repo (Admin SDK) and
  # previously had NO CI path — neither a build/type-check nor a test run —
  # so a Cloud Function regression or a plain TS compile error got a green
  # check (AUD-firebase-04). Routes through `make test-functions` (AG-1: no
  # ad-hoc command duplication) and, unlike the firestore-rules job above,
  # does NOT soft-skip — the suite and Makefile target are permanent parts of
  # the tree, so a missing file/target is itself a failure worth surfacing.
  functions:
    name: functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java (required by Firebase emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learning_tracker/functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache Firebase emulator
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-functions-v1.21.0

      - name: Install functions dependencies
        working-directory: learning_tracker/functions
        run: npm ci

      - name: Build and test Cloud Functions (make test-functions)
        working-directory: learning_tracker
        run: make test-functions

  # ── 9. arb-parity ──────────────────────────────────────────────────────────
  arb-parity:
    name: arb-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # See the format-check job above: local composite actions require the
      # repo to already be checked out (AUD-guardrails-25 bounce).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap
        uses: ./.github/actions/flutter-bootstrap

      - name: Run ARB parity check (make arb-parity)
        run: make arb-parity
