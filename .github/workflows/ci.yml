name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, dev/**]

# Shared Flutter + pub setup extracted via composite action pattern (inline reuse via YAML anchors)
# GitHub Actions does not support YAML anchors natively, so setup steps are duplicated per job.
# Each job is self-contained so it can run in parallel without coordination overhead.

jobs:
  # ── 1. format-check ────────────────────────────────────────────────────────
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Verify formatting
        working-directory: learning_tracker
        run: dart format --set-exit-if-changed .

  # ── 2. analyze ─────────────────────────────────────────────────────────────
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare bundled seed asset (xz → gzip)
        working-directory: learning_tracker
        run: dart run tool/prepare_asset.dart

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Analyze code
        working-directory: learning_tracker
        run: dart analyze --fatal-infos

  # ── 3. audit ───────────────────────────────────────────────────────────────
  # Runs `make audit` when the target exists; skips gracefully if not yet landed.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Run audit (skip gracefully if target absent)
        working-directory: learning_tracker
        run: |
          if make -n audit >/dev/null 2>&1; then
            make audit
          else
            echo "::notice::Makefile 'audit' target not found — skipping (DNI-389 not yet merged)"
          fi

  # ── 4. lint ────────────────────────────────────────────────────────────────
  # Runs custom_lint. AUD-guardrails-03 (2026-07-03): pub.dev's latest
  # custom_lint/custom_lint_core (0.8.1) only support analyzer ^8, but the app
  # forces analyzer ^9 (needed by json_serializable/riverpod_generator) — this
  # used to crash the tool outright. learning_tracker/pubspec.yaml and
  # packages/custom_lints/pubspec.yaml now pin an unreleased-but-merged
  # analyzer-9-compatible commit via dependency_overrides (see the comments
  # there), so the tool runs and correctly reports real diagnostics. It still
  # surfaces ~1,840 pre-existing violations across 8/9 rules that have never
  # been enforced before, so this step stays warn-only (not a silent skip —
  # see docs/coding-standards.md "custom_lint toolchain status") until that
  # debt is remediated. Flip to hard-fail only after that lands.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Run custom_lint (warn-only pending pre-existing-violation remediation)
        working-directory: learning_tracker
        run: |
          if dart pub deps --json 2>/dev/null | grep -q '"custom_lint"'; then
            dart run custom_lint || echo "::warning::custom_lint reported violations — tool itself is fixed (AUD-guardrails-03); see docs/coding-standards.md for the pre-existing-debt count and remediation status."
          else
            echo "::notice::custom_lint not in pubspec — skipping"
          fi

  # ── 5. test + 6. coverage-floor ────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare bundled seed asset (xz → gzip)
        working-directory: learning_tracker
        run: dart run tool/prepare_asset.dart

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Run tests with coverage (make ci)
        working-directory: learning_tracker
        run: make ci

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: |
            learning_tracker/test/**/failures/
            learning_tracker/test/**/*_masterImage.png
            learning_tracker/test/**/*_testImage.png
            learning_tracker/test/**/*_isolatedDiff.png
          if-no-files-found: ignore
          retention-days: 7

      # ── 6. coverage-floor (50% line coverage, always enforced) ──
      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Assert coverage floor ≥ 60%
        run: |
          LCOV_FILE="learning_tracker/coverage/lcov.info"
          SUMMARY=$(lcov --summary "$LCOV_FILE" 2>&1)
          echo "$SUMMARY"
          # Extract line coverage percentage (format: "lines......: 72.5% (...)").
          PCT=$(echo "$SUMMARY" | grep -i "^  lines" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$PCT" ]; then
            echo "::error::Could not parse line coverage from lcov --summary output"
            exit 1
          fi
          FLOOR=60
          # Use awk for float comparison (bash can't do floats natively)
          PASS=$(awk -v pct="$PCT" -v floor="$FLOOR" 'BEGIN { print (pct >= floor) ? "yes" : "no" }')
          echo "Line coverage: ${PCT}% (floor: ${FLOOR}%)"
          if [ "$PASS" != "yes" ]; then
            echo "::error::Coverage ${PCT}% is below the ${FLOOR}% floor — add tests or lower the floor deliberately"
            exit 1
          fi
          echo "Coverage check passed: ${PCT}% >= ${FLOOR}%"

      - name: Upload golden test failures (diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-test-failures
          path: learning_tracker/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: hashFiles('learning_tracker/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          files: learning_tracker/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 7. firestore-rules ──────────────────────────────────────────────────────
  firestore-rules:
    name: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Runs the CANONICAL rules suite — learning_tracker/functions/test/firestore_rules.test.mjs
      # — against the LIVE rules at learning_tracker/firestore.rules. The old
      # test/firestore-rules/*.js suite was obsolete (accounts/{uid} model) AND read a
      # non-existent repo-root firestore.rules, so this job errored ENOENT on every run —
      # silently un-gating rules drift. See `make test-rules`.
      - name: Check if firestore-rules suite exists
        id: check-dir
        run: |
          if [ -f "learning_tracker/functions/test/firestore_rules.test.mjs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firestore_rules.test.mjs not found — skipping firestore-rules job"
          fi

      - name: Setup Java (required by Firebase emulator)
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learning_tracker/functions/package-lock.json

      - name: Install Firebase CLI
        if: steps.check-dir.outputs.exists == 'true'
        run: npm install -g firebase-tools

      - name: Cache Firebase emulator
        if: steps.check-dir.outputs.exists == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-firestore-v1.21.0

      - name: Install test dependencies
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: learning_tracker/functions
        run: npm ci

      - name: Run Firestore rules tests against emulator
        if: steps.check-dir.outputs.exists == 'true'
        working-directory: learning_tracker
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-rules \
            "node --test functions/test/firestore_rules.test.mjs"

  # ── 9. arb-parity ──────────────────────────────────────────────────────────
  arb-parity:
    name: arb-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Run ARB parity check (skip gracefully if tool absent)
        working-directory: learning_tracker
        run: |
          if [ -f "tool/arb_parity_check.dart" ]; then
            dart run tool/arb_parity_check.dart
          else
            echo "::notice::tool/arb_parity_check.dart not found — skipping arb-parity check"
          fi
