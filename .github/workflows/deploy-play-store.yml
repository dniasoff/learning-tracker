name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Override Play Store track (leave empty for auto)'
        required: false
        type: choice
        options:
          - ''
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 10

      - name: Determine track
        id: track
        run: |
          if [ -n "${{ github.event.inputs.track }}" ]; then
            TRACK="${{ github.event.inputs.track }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TRACK="production"
          else
            TRACK="internal"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Deploying to track: $TRACK (branch: ${{ github.ref_name }})"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            learning_tracker/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('learning_tracker/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            learning_tracker/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('learning_tracker/android/**/*.gradle*', 'learning_tracker/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: learning_tracker
        run: flutter pub get

      - name: Generate code
        working-directory: learning_tracker
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > learning_tracker/android/app/google-services.json

      - name: Generate firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" > learning_tracker/lib/firebase_options.dart

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > learning_tracker/android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > learning_tracker/android/key.properties

      - name: Extract version info
        id: version
        working-directory: learning_tracker
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          VERSION_CODE=${{ github.run_number }}
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Generate release notes
        run: |
          NOTES=$(git log --oneline -10 --no-decorate | sed 's/^[a-f0-9]* /- /')
          mkdir -p release-notes
          printf '%s\n' "$NOTES" > release-notes/en-US.txt
          # Truncate to 500 chars (Play Store limit)
          head -c 500 release-notes/en-US.txt > release-notes/en-US.tmp && mv release-notes/en-US.tmp release-notes/en-US.txt
          echo "Generated release notes:"
          cat release-notes/en-US.txt

      - name: Build App Bundle
        working-directory: learning_tracker
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab-${{ github.ref_name }}
          path: learning_tracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jcom.torah.learning_tracker
          releaseFiles: learning_tracker/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          whatsNewDirectory: release-notes
          track: ${{ steps.track.outputs.track }}
          status: completed

      - name: Cleanup signing and Firebase files
        if: always()
        run: |
          rm -f learning_tracker/android/key.properties
          rm -f learning_tracker/android/app/keystore.jks
          rm -f learning_tracker/android/app/google-services.json
          rm -f learning_tracker/lib/firebase_options.dart
