name: Deploy to Google Play

# Triggers ONLY on release-tagged commits and manual dispatch — pushes to
# dev/main no longer auto-deploy, so day-to-day commits don't churn through
# version codes. To ship a release:
#
#   git tag v1.2.3-alpha       # → uploads to alpha (closed testing)
#   git tag v1.2.3-beta        # → uploads to beta  (open testing)
#   git tag v1.2.3             # → uploads to production
#   git push origin --tags
#
# Track suffix on the tag picks the Play track. Plain `v1.2.3` ships to
# production. Use workflow_dispatch with the `track` input to override
# (e.g. ship the current dev tree to alpha without cutting a tag).
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: alpha
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # ── gate-ci-status (AUD-guardrails-14 / AG-11) ──────────────────────────────
  # Fails fast, before any build/signing step runs, unless the EXACT SHA being
  # deployed (github.sha — the dispatched ref's SHA for workflow_dispatch, the
  # tagged commit for push:tags) has at least one completed, successful ci.yml
  # run. Without this, a maintainer tagging a commit that never went through
  # review/CI (emergency hotfix, stale local branch, wrong SHA), or whose
  # ci.yml run is still red/in-progress, could ship straight to Google Play
  # production with nothing in the committed config to stop it. See
  # tool/check_deploy_ci_gate.mjs for the gate logic + its test suite.
  gate-ci-status:
    name: gate-ci-status
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run gate unit tests (Rule 0 — the checker's own correctness gate)
        run: node --test tool/check_deploy_ci_gate.test.mjs

      - name: Require a green ci.yml run for the deploying SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tool/check_deploy_ci_gate.mjs

  # ── backend-deploy (DNI-490 AC-3 / AC-6; AD-49 cutover, AD-54) ─────────────
  # The gated production backend release. It runs ONCE per release run, after
  # gate-ci-status (a green ci.yml run — rules, functions and the dry-run
  # backend-deploy-gate — for this exact SHA), and the app `deploy` job needs
  # it, so the app never ships against an older backend. Through
  # tool/firebase_backend_release.mjs it:
  #   1. lists the deployed functions and explicitly deletes the four retired
  #      callables (tutorResetCompletion, tutorBulkPriorCompletions,
  #      deleteBulkMarkedCompletions, tutorUpsertBookmark) with
  #      `functions:delete ... --force` — absent from source is not absent
  #      from production;
  #   2. lists again and fails if any of them is still deployed;
  #   3. deploys `--only firestore:rules,firestore:indexes,functions` once.
  # Any failure (missing credential, list, delete, verification or deploy)
  # fails this job and therefore the app release. Every Play track shares the
  # one production Firebase project, so every release run takes this gate.
  # Credential: the FIREBASE_TOKEN repo secret (rulings B5, approved).
  backend-deploy:
    name: backend-deploy
    needs: gate-ci-status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: firebase-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: learning_tracker/functions/package-lock.json

      - name: Run release-script tests (Rule 0 — the script's own correctness gate)
        run: node --test tool/firebase_backend_release.test.mjs

      - name: Require the production deploy credential
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::The FIREBASE_TOKEN repo secret is not set; the backend release cannot run, so the app release is blocked (rulings B5)."
            exit 1
          fi

      - name: Install functions dependencies
        working-directory: learning_tracker/functions
        run: npm ci

      - name: Build the functions deploy artifact (tsc)
        working-directory: learning_tracker/functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Undeploy the retired callables, verify, then release rules, indexes and functions once
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node tool/firebase_backend_release.mjs --mode deploy --project torah-study-tracker

  # ── perf-gate (DNI-490 AC-5; AD-54 perf gate, ruling B12) ─────────────────
  # The AD-54 engine benchmark as a BLOCKING release gate: 20 learners ×
  # (40,000 leaf + 200 node events) on the largest corpus; every learner's
  # warm recompute + dailyTarget must stay under 1 s (provisional on this
  # runner until the reference device is named — checklist P9). The cold
  # first load is in the uploaded run record and never fails the gate.
  # In ci.yml the same benchmark runs in the non-blocking perf job.
  perf-gate:
    name: perf-gate
    needs: gate-ci-status
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # CI=true on every GitHub runner, so perfGateSkipReason() lets it run.
      - name: AD-54 warm recompute gate (cold first load recorded, not gated)
        working-directory: learning_tracker
        run: flutter test --tags perf --concurrency=1 --reporter=expanded test/benchmark/learner_state_engine_benchmark_test.dart

      - name: Upload the benchmark run record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutover-perf-record-${{ github.ref_name }}
          path: learning_tracker/build/perf/learner_state_engine_benchmark.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    # DNI-490 AC-6 / AC-5: the app release runs only after the backend
    # release and the perf gate passed.
    needs: [gate-ci-status, backend-deploy, perf-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Local composite actions (`uses: ./...`) resolve from the runner's
      # workspace, which starts empty — the repo must be checked out before
      # the composite's action.yml can be found (AUD-guardrails-25 bounce).
      # This initial checkout only needs to land the action.yml itself; the
      # composite's own checkout step (fetch-depth: 10, below) re-checks out
      # with the history depth this job's `git log` release-notes step needs.
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Flutter bootstrap (Java + Gradle + codegen + asset + secrets)
        uses: ./.github/actions/flutter-bootstrap
        with:
          fetch-depth: '10'
          setup-java: 'true'
          cache-gradle: 'true'
          run-codegen: 'true'
          prepare-asset: 'true'
          decode-secrets: 'true'
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # Repo commits assets/db/content.db.xz (62 MB) so the file fits under
      # GitHub's 100 MB hard limit; the bootstrap action's asset-prep step
      # (dart run tool/prepare_asset.dart) re-compresses it (xz → gzip) for
      # the runtime SeedManager's native dart:io gzip reader before this
      # job's flutter build.

      - name: Determine track
        id: track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track }}"
          else
            REF="${{ github.ref_name }}"
            case "$REF" in
              *-alpha*) TRACK="alpha" ;;
              *-beta*)  TRACK="beta"  ;;
              *-internal*) TRACK="internal" ;;
              *)        TRACK="production" ;;
            esac
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "Deploying to track: $TRACK (ref: ${{ github.ref_name }})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > learning_tracker/android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > learning_tracker/android/key.properties

      - name: Print upload key SHA fingerprints
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v -keystore learning_tracker/android/app/keystore.jks \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" \
            | grep -E "SHA1|SHA256"

      - name: Extract version info
        id: version
        working-directory: learning_tracker
        run: |
          # Prefer the tag's semver (v1.2.3-alpha → 1.2.3) over pubspec's
          # version when this run was triggered by a tag. Otherwise read
          # pubspec.
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
          else
            VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          fi
          # versionCode (Android int) must strictly increase across all
          # releases on every track. github.run_number is reused on re-runs,
          # which Play rejects as a duplicate bundle — multiply by 100 and
          # add run_attempt so re-runs of the same workflow each get a fresh
          # code. Plenty of headroom (max int is 2.1B; 187 * 100 = 18,700).
          VERSION_CODE=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Generate release notes
        run: |
          NOTES=$(git log --oneline -10 --no-decorate | sed 's/^[a-f0-9]* /- /')
          mkdir -p release-notes
          printf '%s\n' "$NOTES" > release-notes/en-US.txt
          # Truncate to 500 chars (Play Store limit)
          head -c 500 release-notes/en-US.txt > release-notes/en-US.tmp && mv release-notes/en-US.tmp release-notes/en-US.txt
          echo "Generated release notes:"
          cat release-notes/en-US.txt

      - name: Build App Bundle
        working-directory: learning_tracker
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab-${{ github.ref_name }}
          path: learning_tracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jcom.torah.learning_tracker
          releaseFiles: learning_tracker/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          whatsNewDirectory: release-notes
          # 'track' (singular) is deprecated in r0adkll/upload-google-play and
          # slated for removal; 'tracks' is the replacement input (single value
          # is accepted). Migrated after the v1.0.67-internal deploy logged the
          # deprecation warning.
          tracks: ${{ steps.track.outputs.track }}
          status: completed

      - name: Cleanup signing and Firebase files
        if: always()
        run: |
          rm -f learning_tracker/android/key.properties
          rm -f learning_tracker/android/app/keystore.jks
          rm -f learning_tracker/android/app/google-services.json
          rm -f learning_tracker/lib/firebase_options.dart
