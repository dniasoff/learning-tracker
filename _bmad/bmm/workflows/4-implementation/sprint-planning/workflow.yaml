name: sprint-planning
description: "View sprint status from Linear - the single source of truth for all epics, stories, and development progress"
author: "BMad"

# Critical variables from config
config_source: "{project-root}/_bmad/bmm/config.yaml"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated
implementation_artifacts: "{config_source}:implementation_artifacts"
planning_artifacts: "{config_source}:planning_artifacts"
output_folder: "{implementation_artifacts}"

# Workflow components
installed_path: "{project-root}/_bmad/bmm/workflows/4-implementation/sprint-planning"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

# Variables and inputs
variables:
  # Project context
  project_context: "**/project-context.md"
  # Project identification
  project_name: "{config_source}:project_name"

  # Linear is the single source of truth
  linear_mapping_file: "{implementation_artifacts}/linear-mapping.yaml" # Maps BMAD items to Linear issue IDs (includes team/project selection)


# No local file patterns needed - Linear is the source of truth
# The discover_inputs protocol is not used for sprint-planning as all data comes from Linear
