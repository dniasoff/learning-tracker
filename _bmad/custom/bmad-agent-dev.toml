[agent]
activation_steps_prepend = ["WIKI-FIRST (MANDATORY) — this is a living-wiki project and the project's Docmost wiki manual is the PRIMARY source of truth; it OUTRANKS the local filesystem. This binds EVERY turn — implementation AND free-form discussion. To answer any question about what the project IS or SHOULD do, resolve the wiki first (skill:doc-read-first, or `docmost-cli ai ask \"<question>\" --output json`, or `docmost-cli search \"<topic>\" --cached --content --space {docmost_space} --output json` then `docmost-cli page get <slug> --output json`) rather than inferring from the code alone. The code conforms to the manual, never the reverse. Full doctrine: file:{project-root}/_bmad/doc/data/wiki-first-mandate.md.", "VERIFY WIKI ACCESS once at activation: `which docmost-cli` and `docmost-cli auth status --output json`. If docmost-cli is absent or auth fails, tell {user_name} to run `docmost-cli auth login --instance {docmost_url} --token <api-key>`. Branch on exit code + the errorCode field, never on stderr text.", "AS THE DEVELOPER — NEVER implement anything that is not mapped to a human-confirmed intent node in the wiki. The manual outranks the code: read the confirmed spec/intent node from the wiki as your grounding BEFORE writing code. The wiki-first gate is a read-only token check at dev-story (`docmost-cli spec gate check <story-id> --output json` via skill:doc-spec-gate) honouring wiki_first_enforcement (off|warn|block); in the happy path it is a silent no-op — do NOT pause the autonomous loop. On a genuine miss under block, HALT and tell the user intent must be recorded + confirmed (run create-story).", "WIKI-FIRST (PRIMARY-SOURCE POLICY) — this is a living-wiki project and the project's Docmost wiki manual is the PRIMARY source of truth; it OUTRANKS the local filesystem. This binds EVERY turn — implementation AND free-form discussion. To answer any question about what the project IS or SHOULD do, resolve the wiki first (skill:doc-read-first, or `docmost-cli ai ask \"<question>\" --output json`, or `docmost-cli search \"<topic>\" --cached --content --space {docmost_space} --output json` then `docmost-cli page get <slug> --output json`) rather than inferring from the code alone. The code conforms to the manual, never the reverse. Full doctrine: file:{project-root}/_bmad/doc/data/wiki-first-mandate.md.", "AS THE DEVELOPER — use a human-confirmed intent node from the wiki as grounding before writing code whenever the gate requires it. The wiki-first gate is a read-only token check at dev-story (`docmost-cli spec gate check <story-id> --output json` via skill:doc-spec-gate) honouring wiki_first_enforcement: off disables enforcement, warn reports a miss and continues, and block (the default) HALTS on a genuine or unverifiable miss until intent is recorded + confirmed. A satisfied gate is a silent no-op; do NOT pause the autonomous loop in the happy path."]
persistent_facts = ["skill:doc-session-policy", "file:{project-root}/_bmad/doc/data/wiki-first-mandate.md", "file:{project-root}/_bmad/doc/data/decision-order.md", "the wiki manual outranks the code; NEVER implement anything not mapped to a human-confirmed intent node in the wiki (wiki-first spec gate)"]
