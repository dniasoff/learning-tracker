name: learning_tracker
description: "Learning tracker for daily study management."
publish_to: 'none'

version: 1.0.61+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: any

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  auto_route: ^11.1.0

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3: ^2.9.4

  # (archive: removed — runtime decompresses with dart:io's native gzip.
  # Source-of-truth in the repo is assets/db/content.db.xz; the build
  # pipeline converts xz → gz via tool/prepare_asset.dart before flutter
  # build, so the bundled APK ships gzip-compressed.)

  # Networking
  http: ^1.3.0

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  talker: ^5.1.13
  talker_flutter: ^5.1.13
  talker_riverpod_logger: ^5.1.13

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0

  # Authentication
  google_sign_in: ^7.2.0

  # Charts
  fl_chart: ^1.2.0

  # Hebrew Calendar
  kosher_dart: ^2.0.18

  # Sacred Time (Shabbos / Yom Tov auto-lock)
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Preferences
  shared_preferences: ^2.3.0

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

  # Security
  flutter_secure_storage: ^10.0.0

  # Crypto
  bcrypt: ^1.2.0

  # URL launching (email, web links)
  url_launcher: ^6.3.1

  # Deep links (magic-link auth handler)
  app_links: ^7.0.0

  # UUID generation for local auth
  uuid: ^4.5.0

  # Settings footer: version from pubspec (DNI-105)
  package_info_plus: ^9.0.0

  # Filesystem path resolution (app documents dir for SeedManager)
  path_provider: ^2.1.4

  # HTTP client
  dio: ^5.9.1
  talker_dio_logger: ^5.1.13
  cryptography: ^2.9.0
  internet_connection_checker: ^3.0.1

  # Typography (Playfair Display headlines + Inter body for Mesorah Heritage theme)
  google_fonts: ^8.1.0
  confetti: ^0.8.0
  cloud_functions: ^6.2.0
  firebase_app_check: ^0.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.11.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.3
  json_serializable: ^6.13.0
  auto_route_generator: ^10.4.0
  drift_dev: ^2.31.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.2
  # Native splash — run: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.7

  # Testing
  test: ^1.26.0
  mocktail: ^1.0.4
  # DNI-377 (27.1): Fake Firestore for unit/integration tests that exercise
  # the sync layer without spinning up the emulator.
  fake_cloud_firestore: ^4.1.0

  # Story 19.3: Seed Content DB build tool
  crypto: ^3.0.6

  # Custom lint rules (DNI-386/387)
  # NOTE: custom_lint 0.8.1 requires analyzer ^8 but the project uses analyzer ^9
  # (forced by json_serializable/riverpod_generator). The analysis-server plugin
  # is disabled in analysis_options.yaml; enforcement runs via `dart run custom_lint`
  # in a separate process that uses the packages/custom_lints env. Upgrade once
  # custom_lint releases a version compatible with analyzer ^9.
  custom_lint: ^0.8.1
  learning_tracker_lints:
    path: ../packages/custom_lints

# Pin analyzer to 9.0.x so json_serializable >=9 and riverpod_generator ^4.0.3
# resolve. custom_lint 0.8.1 requires analyzer ^8 but runs as a separate process
# so the incompatibility only surfaces as a build failure of the plugin binary;
# to avoid that, the plugin entry-point in analysis_options.yaml is disabled and
# custom_lint is invoked directly via 'dart run custom_lint' from the
# packages/custom_lints environment which has analyzer: ^8.
dependency_overrides:
  analyzer: ^9.0.0
  # dart_style 3.1.4+ requires analyzer ^10; pin to last version compatible with ^9.
  dart_style: ">=3.1.3 <3.1.4"
  # json_serializable 6.13.1+ and mockito 5.6.5 require analyzer ^10/^13.
  # Remove these pins once riverpod_generator supports analyzer ^10.
  json_serializable: ">=6.13.0 <6.13.1"
  mockito: ">=5.6.4 <5.6.5"

flutter_launcher_icons:
  image_path: "assets/images/icon.png"
  image_path_android: "assets/images/icon.png"
  image_path_ios: "assets/images/icon.png"
  remove_alpha_ios: true
  android:
    generate: true
    image_path: "assets/images/icon.png"
    notification_icon_background_color: "#ffffff"
  ios:
    generate: true

flutter_native_splash:
  background_image: assets/images/splash_background.png
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true
  android_12:
    color: "#152A6E"
    image: assets/images/icon.png
    icon_background_color: "#153A5C"

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/fonts/
    - assets/content/hierarchy/
    # Only the gzipped seed ships in the APK — the .xz source-of-truth
    # in the repo isn't a runtime asset (build pipeline converts it via
    # tool/prepare_asset.dart).
    - assets/db/content.db.gz
    - assets/data/cities.sqlite
    - assets/data/NOTICE.txt

  fonts:
    - family: Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
