name: learning_tracker
description: "Mishnayos learning tracker for daily study management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3

  # Navigation
  auto_route: ^11.1.0

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Networking
  dio: ^5.9.1

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  talker: ^5.1.13
  talker_flutter: ^5.1.13
  talker_dio_logger: ^5.1.13

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # Authentication
  google_sign_in: ^7.2.0

  # Hebrew Calendar
  kosher_dart: ^2.0.18

  # Security
  flutter_secure_storage: ^10.0.0

  # Crypto
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.11.0
  riverpod_generator: ^3.0.3
  freezed: 3.2.3
  json_serializable: 6.11.2
  auto_route_generator: ^10.4.0
  drift_dev: ^2.31.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
