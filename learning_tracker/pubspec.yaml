name: learning_tracker
description: "Learning tracker for daily study management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: 3.1.0
  riverpod_annotation: 4.0.0

  # Navigation
  auto_route: ^11.1.0

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Networking
  http: ^1.3.0

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  talker: ^5.1.13
  talker_flutter: ^5.1.13
  talker_riverpod_logger: ^5.1.13

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # Authentication
  google_sign_in: ^7.2.0

  # Hebrew Calendar
  kosher_dart: ^2.0.18

  # Preferences
  shared_preferences: ^2.3.0

  # Security
  flutter_secure_storage: ^10.0.0

  # Crypto
  bcrypt: ^1.2.0

  # HTTP client
  dio: ^5.9.1
  talker_dio_logger: ^5.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.11.0
  riverpod_generator: 4.0.0+1
  freezed: ^3.2.3
  json_serializable: ">=6.9.0 <6.11.4"
  auto_route_generator: ^10.4.0
  drift_dev: ^2.31.0

  # Testing
  test: ^1.26.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/fonts/
    - assets/content/

  fonts:
    - family: Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
