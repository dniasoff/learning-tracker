name: learning_tracker
description: "Learning tracker for daily study management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: any

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  auto_route: ^11.1.0

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3: ^2.9.4

  # Networking
  http: ^1.3.0

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  talker: ^5.1.13
  talker_flutter: ^5.1.13
  talker_riverpod_logger: ^5.1.13

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # Authentication
  google_sign_in: ^7.2.0

  # Charts
  fl_chart: ^1.2.0

  # Hebrew Calendar
  kosher_dart: ^2.0.18

  # Preferences
  shared_preferences: ^2.3.0

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1

  # Security
  flutter_secure_storage: ^10.0.0

  # Crypto
  bcrypt: ^1.2.0

  # URL launching (email, web links)
  url_launcher: ^6.3.1

  # Deep links (magic-link auth handler)
  app_links: ^6.4.0

  # UUID generation for local auth
  uuid: ^4.5.0

  # Filesystem path resolution (app documents dir for SeedManager)
  path_provider: ^2.1.4

  # HTTP client
  dio: ^5.9.1
  talker_dio_logger: ^5.1.13
  cryptography: ^2.9.0
  internet_connection_checker: ^3.0.1

  # Typography (Playfair Display headlines + Inter body for Mesorah Heritage theme)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.11.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.3
  json_serializable: ^6.13.0
  auto_route_generator: ^10.4.0
  drift_dev: ^2.31.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.2

  # Testing
  test: ^1.26.0
  mocktail: ^1.0.4

  # Story 19.3: Seed Content DB build tool
  crypto: ^3.0.6

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  image_path_android: "assets/images/app_logo.png"
  image_path_ios: "assets/images/app_logo.png"
  android:
    generate: true
    image_path: "assets/images/app_logo.png"
    notification_icon_background_color: "#ffffff"
  ios:
    generate: true

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/fonts/
    - assets/content/hierarchy/
    - assets/db/

  fonts:
    - family: Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
