analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
    experimental_member_use: ignore
  # AUD-guardrails-03: custom_lint plugin marker intentionally omitted.
  # `dart run custom_lint`'s own workspace discovery does require this exact
  # marker (confirmed in custom_lint's source, both the pub.dev 0.8.1 release
  # and the analyzer-9-compatible git-pinned 0.8.2 commit this project uses
  # via dependency_overrides) — but enabling it here breaks the real CI hard
  # gate instead: analysis_server's legacy plugin loader re-resolves
  # `custom_lint` in an isolated pub context that ignores dependency_overrides,
  # tries to fetch `custom_lint 0.8.2` straight from pub.dev (not published
  # there — only 0.8.1 is), and crashes version solving. `flutter analyze`
  # swallows that crash and still exits 0, but `dart analyze --fatal-infos`
  # (the actual gate — CI `analyze` job, `make analyze`) does not: it fails
  # with a plugin-setup error and a non-zero exit even on an otherwise
  # zero-diagnostic tree. See docs/coding-standards.md "custom_lint toolchain
  # status" for the full history and current status.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - annotate_overrides
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_return_types_on_setters
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_types_as_parameter_names
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - combinators_ordering
    - dangling_library_doc_comments
    - depend_on_referenced_packages
    - directives_ordering
    - empty_catches
    - eol_at_end_of_file
    - exhaustive_cases
    - implicit_reopen
    - invalid_case_patterns
    - library_annotations
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - no_leading_underscores_for_library_prefixes
    - no_leading_underscores_for_local_identifiers
    - no_literal_bool_comparisons
    - noop_primitive_operations
    - null_closures
    - omit_local_variable_types
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_if_null_operators
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_null_aware_operators
    - prefer_single_quotes
    - prefer_spread_collections
    - prefer_typing_uninitialized_variables
    - require_trailing_commas
    - sort_child_properties_last
    - test_types_in_equals
    - throw_in_finally
    - type_init_formals
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_late
    - unnecessary_new
    - unnecessary_null_aware_assignments
    - unnecessary_null_checks
    - unnecessary_null_in_if_null_operators
    - unnecessary_overrides
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - unnecessary_string_escapes
    - unnecessary_string_interpolations
    - unnecessary_this
    - unnecessary_to_list_in_spreads
    - use_build_context_synchronously
    - use_colored_box
    - use_decorated_box
    - use_enums
    - use_full_hex_values_for_flutter_colors
    - use_if_null_to_convert_nulls_to_bools
    - use_is_even_rather_than_modulo
    - use_key_in_widget_constructors
    - use_named_constants
    - use_raw_strings
    - use_string_buffers
    - use_super_parameters
    - valid_regexps
